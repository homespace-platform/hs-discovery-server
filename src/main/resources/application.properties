# ===============================================================
# CORE APPLICATION
# ===============================================================
server.port=8761
spring.application.name=hs-discovery-server
spring.output.ansi.enabled=ALWAYS
spring.main.banner-mode=off
spring.main.log-startup-info=false
spring.threads.virtual.enabled=false

# ===============================================================
# EUREKA SERVER
# ===============================================================
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# ===============================================================
# OBSERVABILITY
# ===============================================================
## Actuator
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
## Logging (TRACE < DEBUG < INFO < WARN < ERROR)
logging.level.root=INFO
logging.level.com.netflix=ERROR
logging.level.com.netflix.eureka=WARN
logging.level.org.springframework.cloud.netflix.eureka=WARN
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n